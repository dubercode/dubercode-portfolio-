
name: Deploy DevOps Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug repository structure
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          echo "Searching package files:"
          find . -maxdepth 4 \( -name package.json -o -name package-lock.json -o -name vite.config.ts \) -print

      - name: Install dependencies
        working-directory: ./dubercode-portfolio
        run: npm ci

      - name: Build application
        working-directory: ./dubercode-portfolio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dubercode-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
